<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>67 AI · Мемный ИИ</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, Arial, sans-serif; }
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #1a0a2d, #2d0a3d, #0a1a2d);
    color: #fff;
    display: flex; justify-content: center; align-items: center;
    padding: 10px;
    overflow: hidden;
  }
  .app {
    width: 100%; max-width: 750px; height: 95vh; max-height: 850px;
    display: flex; flex-direction: column;
    background: rgba(0,0,0,0.55);
    border-radius: 24px;
    border: 2px solid #ff69b4;
    box-shadow: 0 30px 80px rgba(0,0,0,0.8), 0 0 80px rgba(255,105,180,0.2);
    overflow: hidden;
  }
  .header {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 20px;
    background: linear-gradient(135deg, #ff69b4, #7b2ff7);
    border-bottom: 2px solid rgba(255,255,255,0.15);
  }
  .logo {
    width: 50px; height: 50px; border-radius: 14px;
    background: #fff; color: #ff69b4;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 900;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.08) rotate(4deg); }
  }
  .header h1 { font-size: 22px; font-weight: 900; letter-spacing: 1px; }
  .header p { font-size: 11px; opacity: 0.9; }
  .status {
    margin-left: auto;
    background: rgba(255,255,255,0.2);
    padding: 6px 14px; border-radius: 20px;
    font-size: 12px; font-weight: 700;
    display: flex; align-items: center; gap: 6px;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #4ade80;
    animation: blink 1.5s infinite;
  }
  @keyframes blink { 50% { opacity: 0.3; } }

  .chat {
    flex: 1; overflow-y: auto;
    padding: 20px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .chat::-webkit-scrollbar { width: 8px; }
  .chat::-webkit-scrollbar-thumb { background: rgba(255,105,180,0.5); border-radius: 4px; }

  .msg {
    max-width: 85%; padding: 14px 18px;
    border-radius: 18px; font-size: 15px;
    line-height: 1.5; word-wrap: break-word;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.user {
    align-self: flex-end;
    background: linear-gradient(135deg, #ff69b4, #7b2ff7);
    border-bottom-right-radius: 4px;
    box-shadow: 0 4px 15px rgba(255,105,180,0.4);
    font-weight: 700;
  }
  .msg.bot {
    align-self: flex-start;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,105,180,0.4);
    border-bottom-left-radius: 4px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .msg.bot.meme {
    background: linear-gradient(135deg, rgba(255,105,180,0.25), rgba(123,47,247,0.25));
    border-color: #ff69b4;
  }

  .chips {
    display: flex; gap: 6px; flex-wrap: wrap;
    padding: 0 20px 12px;
    max-height: 80px; overflow-y: auto;
  }
  .chip {
    padding: 7px 14px; border-radius: 20px;
    font-size: 12px; font-weight: 700;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,105,180,0.4);
    color: #ffb6d9; cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .chip:hover {
    background: rgba(255,105,180,0.4);
    color: #fff;
    transform: translateY(-2px);
  }

  .input-area {
    padding: 14px 20px;
    background: rgba(0,0,0,0.4);
    border-top: 2px solid rgba(255,105,180,0.3);
    display: flex; gap: 10px;
  }
  input[type="text"] {
    flex: 1; padding: 13px 18px;
    border-radius: 14px;
    border: 2px solid rgba(255,105,180,0.4);
    background: rgba(255,255,255,0.05);
    color: #fff; font-size: 15px;
    outline: none; font-family: inherit; font-weight: 600;
  }
  input[type="text"]:focus {
    border-color: #ff69b4;
    box-shadow: 0 0 0 3px rgba(255,105,180,0.2);
  }
  button.send {
    width: 50px; height: 50px;
    border-radius: 14px; border: none;
    background: linear-gradient(135deg, #ff69b4, #7b2ff7);
    color: #fff; font-size: 20px;
    cursor: pointer; transition: transform 0.2s;
    box-shadow: 0 4px 20px rgba(255,105,180,0.5);
  }
  button.send:hover { transform: scale(1.08); }
  button.send:active { transform: scale(0.95); }

  @media (max-width: 600px) {
    .app { height: 100vh; border-radius: 0; }
    .msg { max-width: 90%; }
  }
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="logo">67</div>
    <div>
      <h1>67 AI</h1>
      <p>мемный ии · 2025-2026</p>
    </div>
    <div class="status"><span class="dot"></span>67</div>
  </div>

  <div class="chat" id="chat">
    <div class="msg bot">йо, я 67 AI 🗿 напиши 67, sixseven, черемша, газан, бррр патапим, тунг сахур или любой другой мем</div>
  </div>

  <div class="chips" id="chips"></div>

  <div class="input-area">
    <input type="text" id="input" placeholder="напиши 67 или мем..." onkeydown="if(event.key==='Enter'){send();}">
    <button class="send" onclick="send()">➤</button>
  </div>

</div>

<script>
  var chat = document.getElementById('chat');
  var input = document.getElementById('input');
  var chips = document.getElementById('chips');

  /* ============ МЕМЫ И ИХ РЕАКЦИИ ============ */
  /* Важно: реакции НЕ повторяют мем, а КОММЕНТИРУЮТ его */
  var MEMES = {
    '67': [
      'о, ты шаришь 🗿 67 это святое',
      '67 бой на связи 🔥',
      'шесть семь активирован 🗿',
      'ты сигма если написал 67 💯',
      '67 это не число, это состояние души 🗿',
      'сразу видно — свой 🗿🔥',
      '67 навсегда 🗿'
    ],
    '6 7': [
      'разделил 67 на 6 и 7 — уважение 🗿',
      '6 и 7 вместе = сила 🗿🔥',
      'вижу, ты знаешь секрет 6 7 💯',
      '6 7 это база 🗿',
      'ты точно сигма если пишешь 6 7 🗿'
    ],
    'sixseven': [
      'о, на английском зашёл 🗿 уважение',
      'SIX SEVEN — ты интернациональный сигма 🔥',
      'английская версия 67 💯',
      'sixseven бой 🗿',
      'вижу, ты шаришь в англ версии 🗿'
    ],
    'шесть семь': [
      'на русском написал — красава 🗿',
      'шесть семь — это по-нашему 🔥',
      'ты патриот 67 💯',
      'шесть семь это святое 🗿',
      'на русском 67 — это уважение 🗿'
    ],
    'сикссевен': [
      'сикссевен бой 🗿🔥',
      'о, ты шаришь в транслите 💯',
      'сикссевен это святое 🗿',
      'ты точно свой если пишешь сикссевен 🗿'
    ],
    'черемша': [
      'о, черемша! 🗿 ты знаешь толк',
      'черемша — это сила 💯',
      'вижу, ты шаришь в черемше 🗿🔥',
      'черемша газан — комбо 🗿',
      'черемша бой 🗿'
    ],
    'газан': [
      'газан! 🗿 ты знаешь мемы',
      'ГАЗАН это святое 💯',
      'о, газан подъехал 🗿🔥',
      'газан черемша — топ 🗿',
      'ты точно сигма если пишешь газан 🗿'
    ],
    'бррр': [
      'бррр холодно 🥶 держи плед',
      'о, бррр — это моё любимое 🗿',
      'бррр это святое 🥶',
      'ты замёрз? 🥶 держи 67',
      'бррр бой 🥶🗿'
    ],
    'патапим': [
      'патапим патапим 🗿 это ритм',
      'о, патапим! ты знаешь толк 🔥',
      'патапим это святое 🗿💯',
      'ты шаришь в патапим 🗿',
      'патапим бой 🥶🗿'
    ],
    'тунг': [
      'тунг тунг 🗿 это святое',
      'о, тунг подъехал 🔥',
      'тунг тунг тунг 💯',
      'ты шаришь в тунг 🗿',
      'тунг бой 🗿'
    ],
    'сахур': [
      'сахур! 🗿 ты знаешь мемы',
      'САХУР это святое 💯',
      'о, сахур подъехал 🗿🔥',
      'сахур бой 🗿',
      'ты точно сигма если пишешь сахур 🗿'
    ],
    'тунг сахур': [
      'О! ТУНГ САХУР — это комбо 🗿🔥',
      'тунг сахур — ты легенда 💯',
      'тунг сахур это святое 🗿',
      'о, знаток тунг сахур 🗿🔥',
      'тунг сахур бой 🗿'
    ],
    'бррр патапим': [
      'О! БРРР ПАТАПИМ — это топ 🥶🗿',
      'бррр патапим — ты шаришь 💯',
      'о, комбо бррр патапим 🔥',
      'бррр патапим это святое 🥶🗿',
      'ты легенда если пишешь бррр патапим 🗿'
    ],
    'сигма': [
      'о, ты сигма 🗿 уважение',
      'СИГМА бой 🔥',
      'сигма сигма — ты шаришь 💯',
      'о, сигма подъехал 🗿',
      'ты точно сигма если пишешь сигма 🗿🔥'
    ],
    'скибиди': [
      'о, скибиди доп доп 🚽🗿',
      'скибиди туалет — ты шаришь 💯',
      'СКИБИДИ бой 🚽🗿🔥',
      'о, скибиди подъехал 🚽',
      'ты легенда если пишешь скибиди 🗿'
    ],
    'ризз': [
      'о, ты риззлер 🗿 уважение',
      'РИЗЗ бой 🔥',
      'ризз — ты шаришь 💯',
      'о, ризз подъехал 🗿',
      'ты сигма если пишешь ризз 🗿🔥'
    ],
    'мем': [
      'о, мем подъехал 🗿',
      'мем — это святое 💯',
      'МЕМ бой 🔥',
      'ты шаришь в мемах 🗿',
      'о, мемер на связи 🗿'
    ],
    '67ai': [
      'о, ты про меня 🗿 приятно',
      '67 AI это я 🔥',
      'да, я 67 AI 💯',
      'о, ты знаешь моё имя 🗿',
      'я 67 AI, приятно познакомиться 🗿🔥'
    ],
    'привет': [
      'о, привет 🗿 как сам?',
      'здарова бой 🗿',
      'йо, ты на связи 🔥',
      'привет, сигма 🗿',
      'о, привет 🗿 чё делаешь?'
    ]
  };

  /* ============ ОТВЕТЫ НЕ ПО ТЕМЕ ============ */
  var NOT_MEME = [
    'не понял 🗿 напиши 67 или мем',
    'это не мем 🗿 напиши sixseven или черемша',
    'ты не в теме 🗿 напиши газан или бррр патапим',
    'хм, не знаю такого 🗿 попробуй тунг сахур',
    'не понял 🗿 напиши сигма или скибиди',
    'это не по-нашему 🗿 напиши 67',
    'хм, я такое не знаю 🗿 попробуй ризз или мем',
    'ты не написал мем 🗿 попробуй 6 7 или шесть семь',
    'не понял 🗿 я знаю только мемы 2025-2026'
  ];

  /* ============ ФУНКЦИИ ============ */
  function findMeme(text) {
    var lower = text.toLowerCase().trim();

    /* Сначала длинные фразы, потом короткие */
    var keys = Object.keys(MEMES).sort(function(a, b) { return b.length - a.length; });
    for (var i = 0; i < keys.length; i++) {
      if (keys[i] === 'привет') continue;
      if (lower.indexOf(keys[i]) !== -1) {
        return keys[i];
      }
    }

    /* Проверка на приветствие отдельно */
    if (lower.indexOf('привет') !== -1 || lower.indexOf('здарова') !== -1 ||
        lower.indexOf('хай') !== -1 || lower.indexOf('hello') !== -1 ||
        lower.indexOf('hi') !== -1 || lower.indexOf('ку') !== -1) {
      return 'привет';
    }

    return null;
  }

  function getReply(text) {
    var meme = findMeme(text);

    if (meme) {
      var replies = MEMES[meme];
      var random = Math.floor(Math.random() * replies.length);
      return replies[random];
    }

    return NOT_MEME[Math.floor(Math.random() * NOT_MEME.length)];
  }

  function addMsg(text, who, isMeme) {
    var div = document.createElement('div');
    div.className = 'msg ' + who + (isMeme ? ' meme' : '');
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function send() {
    var text = input.value.trim();
    if (!text) return;
    addMsg(text, 'user');
    input.value = '';
    var meme = findMeme(text);
    setTimeout(function() {
      var reply = getReply(text);
      addMsg(reply, 'bot', !!meme);
    }, 300);
  }

  function quick(text) {
    input.value = text;
    send();
  }

  /* ============ ЧИПЫ ============ */
  var chipWords = ['67', '6 7', 'sixseven', 'шесть семь', 'черемша', 'газан', 'бррр', 'патапим', 'тунг сахур', 'бррр патапим', 'сигма', 'скибиди', 'ризз', 'мем', 'привет'];
  chipWords.forEach(function(w) {
    var c = document.createElement('div');
    c.className = 'chip';
    c.textContent = w;
    c.onclick = function() { quick(w); };
    chips.appendChild(c);
  });
</script>
</body>
</html>
