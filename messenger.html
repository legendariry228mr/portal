<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>💬 Мессенджер PRO</title>
<script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body { background: linear-gradient(135deg, #0a0a1a, #1a0a2d, #0a1a2d); color: #fff; }

  #authScreen { position: fixed; inset: 0; display: flex; justify-content: center; align-items: center; z-index: 1000; padding: 20px; overflow-y: auto; background: radial-gradient(circle at 30% 30%, #1a0a2d, #0a0a1a 70%); }
  #authScreen.hidden { display: none; }
  .auth-card { background: rgba(255,255,255,0.05); border: 2px solid rgba(59,130,246,0.4); border-radius: 28px; padding: 36px 28px; max-width: 440px; width: 100%; text-align: center; box-shadow: 0 30px 80px rgba(0,0,0,0.8), 0 0 80px rgba(59,130,246,0.3); backdrop-filter: blur(20px); margin: auto; }
  .auth-card h1 { font-size: 26px; margin-bottom: 6px; background: linear-gradient(135deg, #3b82f6, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .auth-card p { color: #888; font-size: 13px; margin-bottom: 18px; }
  .auth-tabs { display: flex; gap: 8px; margin-bottom: 18px; }
  .auth-tab { flex: 1; padding: 11px; border-radius: 12px; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1); color: #c0c0e0; font-weight: 700; cursor: pointer; font-size: 13px; font-family: inherit; }
  .auth-tab.active { background: linear-gradient(135deg, #3b82f6, #ec4899); border-color: transparent; color: #fff; }
  .auth-input { width: 100%; padding: 13px 16px; border-radius: 14px; border: 2px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: #fff; font-size: 14px; outline: none; margin-bottom: 10px; font-family: inherit; }
  .auth-input:focus { border-color: #ec4899; }
  .auth-btn { width: 100%; padding: 14px; border-radius: 14px; border: none; background: linear-gradient(135deg, #3b82f6, #ec4899); color: #fff; font-size: 15px; font-weight: 800; cursor: pointer; margin-top: 6px; box-shadow: 0 8px 30px rgba(236,72,153,0.5); font-family: inherit; }
  .auth-btn.green { background: linear-gradient(135deg, #4ade80, #22c55e); }
  .auth-btn.gray { background: rgba(255,255,255,0.1); }
  .auth-error { color: #f87171; font-size: 12px; margin-bottom: 8px; display: none; }
  .captcha-box { display: flex; gap: 12px; align-items: center; padding: 10px 14px; border-radius: 12px; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1); margin-bottom: 10px; }
  .captcha-question { font-size: 18px; font-weight: 900; color: #ec4899; font-family: monospace; }
  .captcha-input { width: 80px; padding: 10px; border-radius: 10px; border: 2px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: #fff; font-size: 16px; text-align: center; outline: none; font-family: inherit; }

  #app { display: none; height: 100vh; width: 100vw; }
  #app.active { display: flex; }
  .sidebar { width: 360px; display: flex; flex-direction: column; background: rgba(0,0,0,0.5); border-right: 1px solid rgba(59,130,246,0.2); flex-shrink: 0; transition: transform 0.3s; }
  .sidebar-header { padding: 16px 20px; background: linear-gradient(135deg, #3b82f6, #ec4899); display: flex; align-items: center; gap: 10px; }
  .sidebar-avatar { width: 48px; height: 48px; border-radius: 50%; background: #fff; color: #ec4899; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 20px; flex-shrink: 0; overflow: hidden; border: 2px solid rgba(255,255,255,0.5); cursor: pointer; }
  .sidebar-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .sidebar-info { flex: 1; min-width: 0; }
  .sidebar-name { font-weight: 800; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sidebar-status { font-size: 11px; opacity: 0.9; }
  .icon-btn { width: 40px; height: 40px; border-radius: 12px; border: none; background: rgba(255,255,255,0.2); color: #fff; font-size: 17px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-family: inherit; }
  .icon-btn:hover { background: rgba(255,255,255,0.35); }
  .sidebar-nav { display: flex; gap: 6px; padding: 12px 14px; border-bottom: 1px solid rgba(255,255,255,0.08); background: rgba(0,0,0,0.2); }
  .nav-tab { flex: 1; padding: 11px 10px; border-radius: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); color: #c0c0e0; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; font-family: inherit; }
  .nav-tab.active { background: linear-gradient(135deg, #3b82f6, #ec4899); border-color: transparent; color: #fff; }
  .sidebar-content { flex: 1; overflow-y: auto; padding: 10px; }
  .sidebar-content::-webkit-scrollbar { width: 6px; }
  .sidebar-content::-webkit-scrollbar-thumb { background: rgba(236,72,153,0.5); border-radius: 3px; }
  .search-input { width: 100%; padding: 12px 16px; border-radius: 12px; border: 2px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: #fff; font-size: 14px; outline: none; font-family: inherit; margin-bottom: 10px; }
  .search-input:focus { border-color: #ec4899; }
  .chat-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; cursor: pointer; margin-bottom: 4px; }
  .chat-item:hover { background: rgba(236,72,153,0.15); }
  .chat-item.active { background: rgba(236,72,153,0.25); }
  .chat-avatar { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, #3b82f6, #ec4899); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 18px; flex-shrink: 0; overflow: hidden; position: relative; }
  .chat-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .chat-avatar .online-dot { position: absolute; bottom: 2px; right: 2px; width: 12px; height: 12px; border-radius: 50%; background: #4ade80; border: 2px solid #0a0a1a; }
  .chat-info { flex: 1; min-width: 0; }
  .chat-name { font-weight: 700; font-size: 14px; margin-bottom: 2px; }
  .chat-last { font-size: 12px; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .main { flex: 1; display: flex; flex-direction: column; background: rgba(0,0,0,0.2); overflow: hidden; }
  .main-header { padding: 14px 20px; background: rgba(0,0,0,0.4); border-bottom: 1px solid rgba(59,130,246,0.2); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .back-btn { display: none; width: 40px; height: 40px; border-radius: 50%; border: none; background: rgba(255,255,255,0.1); color: #fff; font-size: 18px; cursor: pointer; align-items: center; justify-content: center; flex-shrink: 0; }
  .main-header-info { flex: 1; min-width: 0; }
  .main-header-name { font-weight: 800; font-size: 16px; }
  .main-header-sub { font-size: 12px; color: #4ade80; }
  .main-content { flex: 1; overflow-y: auto; padding: 20px; }
  .main-content::-webkit-scrollbar { width: 8px; }
  .main-content::-webkit-scrollbar-thumb { background: rgba(236,72,153,0.5); border-radius: 4px; }

  .msg-wrapper { display: flex; flex-direction: column; margin-bottom: 10px; max-width: 75%; }
  .msg-wrapper.mine { align-self: flex-end; margin-left: auto; }
  .msg { padding: 12px 16px; border-radius: 18px; font-size: 15px; line-height: 1.5; word-wrap: break-word; }
  .msg-wrapper.mine .msg { background: linear-gradient(135deg, #3b82f6, #ec4899); border-bottom-right-radius: 4px; }
  .msg-wrapper.theirs .msg { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); border-bottom-left-radius: 4px; }
  .msg-time { font-size: 10px; opacity: 0.6; margin-top: 4px; text-align: right; }
  .msg img, .msg video { max-width: 100%; border-radius: 12px; margin-top: 6px; display: block; }

  .input-area { padding: 12px 16px; background: rgba(0,0,0,0.4); border-top: 1px solid rgba(59,130,246,0.2); display: flex; gap: 10px; align-items: flex-end; flex-shrink: 0; }
  .msg-input { flex: 1; padding: 12px 18px; border-radius: 24px; border: 2px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: #fff; font-size: 15px; outline: none; font-family: inherit; resize: none; max-height: 100px; }
  .msg-input:focus { border-color: #ec4899; }
  .send-btn { width: 48px; height: 48px; border-radius: 50%; border: none; background: linear-gradient(135deg, #3b82f6, #ec4899); color: #fff; font-size: 20px; cursor: pointer; flex-shrink: 0; }

  .channel-card { padding: 16px; border-radius: 18px; background: linear-gradient(135deg, rgba(59,130,246,0.15), rgba(236,72,153,0.15)); border: 1px solid rgba(236,72,153,0.3); margin-bottom: 12px; cursor: pointer; }
  .channel-card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .channel-card-avatar { width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, #3b82f6, #ec4899); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 22px; overflow: hidden; border: 3px solid rgba(255,255,255,0.2); flex-shrink: 0; }
  .channel-card-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .channel-card-info { flex: 1; min-width: 0; }
  .channel-card-name { font-weight: 800; font-size: 15px; }
  .channel-card-subs { font-size: 12px; color: #a0a0c0; }
  .channel-card-desc { font-size: 13px; color: #c0c0e0; line-height: 1.5; }

  .post { background: linear-gradient(135deg, rgba(59,130,246,0.08), rgba(236,72,153,0.08)); border: 1px solid rgba(236,72,153,0.2); border-radius: 20px; padding: 18px; margin-bottom: 16px; }
  .post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .post-header .channel-card-avatar { width: 42px; height: 42px; font-size: 16px; }
  .post-author { font-weight: 700; font-size: 14px; }
  .post-time { font-size: 11px; color: #888; }
  .post-text { font-size: 15px; line-height: 1.6; margin-bottom: 12px; white-space: pre-wrap; }
  .post-image, .post-video { max-width: 100%; border-radius: 14px; margin-bottom: 12px; display: block; }
  .post-actions { display: flex; gap: 8px; flex-wrap: wrap; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.05); }
  .reaction-btn { padding: 8px 16px; border-radius: 22px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #c0c0e0; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 5px; font-family: inherit; }
  .reaction-btn.active { background: linear-gradient(135deg, #3b82f6, #ec4899); color: #fff; border-color: transparent; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); z-index: 3000; display: none; align-items: center; justify-content: center; padding: 20px; }
  .modal-overlay.active { display: flex; }
  .modal-card { background: linear-gradient(135deg, #1a0a2d, #0a1a2d); border: 2px solid #ec4899; border-radius: 24px; padding: 26px; max-width: 480px; width: 100%; max-height: 90vh; overflow-y: auto; }
  .modal-card h2 { font-size: 20px; margin-bottom: 16px; text-align: center; }
  .modal-card input, .modal-card textarea { width: 100%; padding: 12px 16px; border-radius: 12px; border: 2px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); color: #fff; font-size: 14px; outline: none; margin-bottom: 12px; font-family: inherit; }
  .modal-card textarea { resize: vertical; min-height: 80px; }
  .modal-card label { display: block; font-size: 12px; color: #888; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1.5px; }
  .modal-btn { width: 100%; padding: 14px; border-radius: 12px; border: none; background: linear-gradient(135deg, #3b82f6, #ec4899); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; margin-bottom: 8px; font-family: inherit; }
  .modal-btn.danger { background: linear-gradient(135deg, #f87171, #dc2626); }
  .modal-btn.gray { background: rgba(255,255,255,0.1); }
  .modal-btn.green { background: linear-gradient(135deg, #4ade80, #22c55e); }
  .modal-btn.gold { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #000; }

  .toast { position: fixed; top: 20px; left: 50%; transform: translate(-50%, -100px); background: rgba(0,0,0,0.9); color: #fff; padding: 14px 28px; border-radius: 14px; border: 2px solid #ec4899; font-size: 14px; font-weight: 700; z-index: 5000; transition: transform 0.4s; max-width: 90vw; }
  .toast.show { transform: translate(-50%, 0); }

  .server-box { background: rgba(74,222,128,0.1); border: 2px solid rgba(74,222,128,0.5); border-radius: 14px; padding: 14px; margin: 12px 0; font-size: 12px; color: #a0e0b0; }
  .server-box .id { font-family: monospace; font-size: 14px; color: #4ade80; font-weight: 700; background: rgba(0,0,0,0.4); padding: 8px 12px; border-radius: 8px; margin: 8px 0; word-break: break-all; cursor: pointer; user-select: all; }
  .server-box .label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1px; }

  @media (max-width: 800px) {
    .sidebar { position: absolute; inset: 0; width: 100%; z-index: 100; }
    .sidebar.hidden { transform: translateX(-100%); }
    .main { position: absolute; inset: 0; z-index: 90; }
    .back-btn { display: flex; }
    .msg-wrapper { max-width: 88%; }
  }
</style>
</head>
<body>

<div id="authScreen">
  <div class="auth-card">
    <h1>💬 Мессенджер PRO</h1>
    <p>Соцсеть · Каналы · P2P</p>
    <div class="auth-tabs">
      <button class="auth-tab active" id="tabLogin" onclick="switchAuthTab('login')">Вход</button>
      <button class="auth-tab" id="tabRegister" onclick="switchAuthTab('register')">Регистрация</button>
    </div>
    <div id="loginForm">
      <input type="text" id="loginNick" class="auth-input" placeholder="Твой ник">
      <input type="password" id="loginPass" class="auth-input" placeholder="Пароль">
      <div class="auth-error" id="loginError"></div>
      <button class="auth-btn" onclick="handleLogin()">Войти</button>
    </div>
    <div id="registerForm" style="display: none;">
      <input type="text" id="regNick" class="auth-input" placeholder="Придумай ник" maxlength="20">
      <input type="password" id="regPass" class="auth-input" placeholder="Пароль">
      <input type="password" id="regPass2" class="auth-input" placeholder="Повтори пароль">
      <div class="captcha-box">
        <span class="captcha-question" id="captchaQ">2 + 3 = ?</span>
        <input type="number" id="captchaA" class="captcha-input" placeholder="?">
      </div>
      <div class="auth-error" id="regError"></div>
      <button class="auth-btn" onclick="handleRegister()">Зарегистрироваться</button>
    </div>
  </div>
</div>

<div id="app">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-avatar" id="myAvatar" onclick="openSettings()">?</div>
      <div class="sidebar-info">
        <div class="sidebar-name" id="myName">—</div>
        <div class="sidebar-status" id="myStatus">● В сети</div>
      </div>
      <button class="icon-btn" onclick="openServerMenu()" title="Сервер">🌐</button>
      <button class="icon-btn" onclick="openSettings()" title="Настройки">⚙️</button>
      <button class="icon-btn" onclick="goToPortal()" title="В портал">🏠</button>
    </div>
    <div class="sidebar-nav">
      <button class="nav-tab active" onclick="switchSection('chats', event)">💬 Чаты</button>
      <button class="nav-tab" onclick="switchSection('channels', event)">📺 Каналы</button>
    </div>
    <div class="sidebar-content" id="sidebarContent">
      <div id="sectionChats">
        <input type="text" class="search-input" id="searchInput" placeholder="🔍 Найти игрока по нику..." oninput="searchPlayer()">
        <div id="foundPlayers"></div>
        <div id="chatsList"></div>
      </div>
      <div id="sectionChannels" style="display: none;">
        <button class="auth-btn" onclick="openCreateChannel()" style="margin-bottom: 12px;">➕ Создать канал</button>
        <div id="channelsList"></div>
      </div>
    </div>
  </div>
  <div class="main" id="main">
    <div class="main-header" id="mainHeader">
      <button class="back-btn" onclick="closeMainMobile()">←</button>
      <div class="main-header-info">
        <div class="main-header-name" id="mainHeaderName">Добро пожаловать!</div>
        <div class="main-header-sub" id="mainHeaderSub">Выбери раздел</div>
      </div>
      <div id="mainHeaderActions" style="display:flex; gap:8px;"></div>
    </div>
    <div class="main-content" id="mainContent">
      <div style="text-align: center; padding: 60px 20px; color: #666;">
        <div style="font-size: 80px; margin-bottom: 20px;">💬</div>
        <h3 style="font-size: 20px;">Выбери раздел</h3>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal"><div class="modal-card" id="modalCard"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   ГЛОБАЛЬНЫЕ
============================================================ */
var DB = { users: [], chats: {}, channels: [] };
var currentUser = null;
var currentChat = null;
var currentChannel = null;
var currentSection = 'chats';
var peer = null;
var myPeerId = null;
var serverConn = null;
var isServer = false;
var clientConns = [];
var pendingServerId = null;
var reconnectTimer = null;
var peerInitLock = false;
var searchTimer = null;

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 9); }

function showToast(text, color) {
  var t = document.getElementById('toast');
  if (!t) return;
  t.textContent = text;
  t.style.borderColor = color || '#ec4899';
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(function() { t.classList.remove('show'); }, 2200);
}

function getUser(nick) {
  if (!nick) return null;
  for (var i = 0; i < DB.users.length; i++) {
    if (DB.users[i].nick.toLowerCase() === nick.toLowerCase()) return DB.users[i];
  }
  return null;
}

function avatarHTML(user) {
  if (user && user.avatarImage) return '<img src="' + user.avatarImage + '">';
  return (user ? user.nick[0].toUpperCase() : '?');
}

/* ============================================================
   БАЗА
============================================================ */
function saveDB() {
  try { localStorage.setItem('messenger_v5_db', JSON.stringify(DB)); } catch (e) {}
  if (isServer) {
    serverBroadcast({ type: 'full_state', users: DB.users, chats: DB.chats, channels: DB.channels });
  } else if (serverConn && serverConn.open) {
    try { serverConn.send({ type: 'update_from_client', users: DB.users, chats: DB.chats, channels: DB.channels }); } catch (e) {}
  }
}

function loadDB() {
  try {
    var raw = localStorage.getItem('messenger_v5_db');
    if (raw) DB = JSON.parse(raw);
  } catch (e) {}
  if (!DB.users) DB.users = [];
  if (!DB.chats) DB.chats = {};
  if (!DB.channels) DB.channels = [];
  DB.channels.forEach(function(c) {
    if (!c.admins) c.admins = [];
    if (!c.subscribers) c.subscribers = [c.owner];
    if (!c.posts) c.posts = [];
    if (c.allowPostByAll === undefined) c.allowPostByAll = false;
    if (c.allowComments === undefined) c.allowComments = true;
    if (c.allowReactions === undefined) c.allowReactions = true;
    c.posts.forEach(function(p) {
      if (!p.reactions) p.reactions = { like: 0, love: 0, fire: 0, laugh: 0 };
      if (!p.myReactions) p.myReactions = {};
      if (!p.comments) p.comments = [];
    });
  });
}

/* ============================================================
   PEER
============================================================ */
function serverBroadcast(data, excludeConn) {
  if (!isServer) return;
  clientConns.forEach(function(conn) {
    if (conn === excludeConn) return;
    if (conn.open) { try { conn.send(data); } catch (e) {} }
  });
}

function handleConnData(conn, data) {
  if (data.type === 'hello') { conn.send({ type: 'who_are_you' }); return; }
  if (data.type === 'im_client') {
    if (!isServer) { conn.send({ type: 'no_server' }); return; }
    clientConns.push(conn);
    conn.send({ type: 'full_state', users: DB.users, chats: DB.chats, channels: DB.channels });
    serverBroadcast({ type: 'user_online', nick: data.nick }, conn);
    showToast('👤 Подключился: ' + data.nick, '#4ade80');
    updateServerStatusUI();
    return;
  }
  if (data.type === 'full_state') {
    DB.users = data.users || [];
    DB.chats = data.chats || {};
    DB.channels = data.channels || [];
    try { localStorage.setItem('messenger_v5_db', JSON.stringify(DB)); } catch (e) {}
    serverConn = conn;
    updateServerStatusUI();
    showToast('✅ Синхронизировано', '#4ade80');
    refreshAll();
    return;
  }
  if (data.type === 'no_server') { showToast('⚠ Это не сервер', '#f87171'); return; }
  if (data.type === 'user_online') { showToast('👤 ' + data.nick + ' в сети', '#4ade80'); return; }
  if (data.type === 'update_from_client') {
    if (!isServer) return;
    DB.users = data.users || DB.users;
    DB.chats = data.chats || DB.chats;
    DB.channels = data.channels || DB.channels;
    try { localStorage.setItem('messenger_v5_db', JSON.stringify(DB)); } catch (e) {}
    serverBroadcast({ type: 'full_state', users: DB.users, chats: DB.chats, channels: DB.channels }, conn);
    refreshAll();
    return;
  }
}

function initPeer() {
  if (peerInitLock) return;
  peerInitLock = true;
  if (peer) { try { peer.destroy(); } catch (e) {} peer = null; }
  myPeerId = 'msgv5-' + currentUser.toLowerCase() + '-' + Math.random().toString(36).slice(2, 6);
  peer = new Peer(myPeerId, { debug: 0 });
  peer.on('open', function(id) {
    myPeerId = id;
    showToast('🟢 Подключено', '#4ade80');
    updateServerStatusUI();
    peerInitLock = false;
    if (pendingServerId && !serverConn) {
      setTimeout(function() { tryConnectToServer(pendingServerId); }, 500);
    }
  });
  peer.on('error', function(e) {
    console.warn('Peer error:', e);
    peerInitLock = false;
    if (e.type === 'peer-unavailable') showToast('⚠ Сервер не найден', '#f87171');
    else if (e.type === 'network' || e.type === 'server-error') showToast('⚠ Сеть PeerJS недоступна', '#f87171');
    else if (e.type === 'unavailable-id') setTimeout(initPeer, 1000);
  });
  peer.on('disconnected', function() {
    peerInitLock = false;
    setTimeout(function() {
      if (peer && peer.disconnected && !peer.destroyed) {
        try { peer.reconnect(); } catch (e) {}
      }
    }, 2000);
  });
  peer.on('connection', function(conn) {
    conn.on('data', function(data) { handleConnData(conn, data); });
    conn.on('close', function() {
      clientConns = clientConns.filter(function(c) { return c !== conn; });
      updateServerStatusUI();
    });
  });
}

function startApp() {
  document.getElementById('authScreen').classList.add('hidden');
  document.getElementById('app').classList.add('active');
  updateProfileUI();
  initPeer();
  renderChats();
  renderChannels();
  updateServerStatusUI();
}

function updateServerStatusUI() {

  else { el.textContent = '● В сети (без сервера)'; el.style.color = '#fbbf24'; }
}

function copyMyId() {

}

function becomeServer() {
  if (isServer) { showToast('Ты уже сервер', '#fbbf24'); return; }
  isServer = true;
  updateServerStatusUI();
  showToast('🌐 Ты теперь сервер!', '#4ade80');
  closeModal();
  openServerMenu();
}

function connectToServer() {
  var input = document.getElementById('serverPeerId');
  var id = input ? input.value.trim() : '';
  if (!id) { showToast('⚠ Введи ID сервера', '#f87171'); return; }
  pendingServerId = id;
  closeModal();
  tryConnectToServer(id);
}

function tryConnectToServer(id) {
  if (!peer) { showToast('⏳ Инициализация...', '#fbbf24'); setTimeout(function() { tryConnectToServer(id); }, 1000); return; }
  if (peer.destroyed) { showToast('🔄 Пересоздаю...', '#fbbf24'); initPeer(); setTimeout(function() { tryConnectToServer(id); }, 1500); return; }
  if (peer.disconnected) { showToast('🔄 Переподключение...', '#fbbf24'); try { peer.reconnect(); } catch (e) {} setTimeout(function() { tryConnectToServer(id); }, 1500); return; }
  if (serverConn && serverConn.open && serverConn.peer === id) { showToast('✅ Уже подключён', '#4ade80'); return; }
  if (serverConn) { try { serverConn.close(); } catch (e) {} serverConn = null; }

  showToast('🔗 Подключение...', '#fbbf24');
  var conn;
  try { conn = peer.connect(id, { reliable: true }); }
  catch (e) { showToast('⚠ Ошибка соединения', '#f87171'); scheduleReconnect(id); return; }
  if (!conn) { showToast('⚠ Не удалось', '#f87171'); scheduleReconnect(id); return; }

  conn.on('open', function() {
    serverConn = conn;
    conn.send({ type: 'im_client', nick: currentUser });
    updateServerStatusUI();
    showToast('🔗 Подключено, ждём данные...', '#fbbf24');
    clearTimeout(reconnectTimer);
  });

  conn.on('data', function(data) {
    if (data.type === 'full_state') {
      DB.users = data.users || [];
      DB.chats = data.chats || {};
      DB.channels = data.channels || [];
      try { localStorage.setItem('messenger_v5_db', JSON.stringify(DB)); } catch (e) {}
      updateServerStatusUI();
      refreshAll();
      showToast('✅ Синхронизировано!', '#4ade80');
      closeModal();
    } else if (data.type === 'no_server') {
      showToast('⚠ Это не сервер', '#f87171');
      serverConn = null; pendingServerId = null;
      updateServerStatusUI();
    } else {
      handleConnData(conn, data);
    }
  });

  conn.on('error', function() {
    showToast('⚠ Ошибка соединения', '#f87171');
    serverConn = null; updateServerStatusUI();
    scheduleReconnect(id);
  });

  conn.on('close', function() {
    if (serverConn === conn) {
      serverConn = null; updateServerStatusUI();
      showToast('⚠ Связь потеряна', '#f87171');
      scheduleReconnect(id);
    }
  });
}

function scheduleReconnect(id) {
  if (!pendingServerId) return;
  clearTimeout(reconnectTimer);
  reconnectTimer = setTimeout(function() {
    if (!serverConn && pendingServerId) tryConnectToServer(pendingServerId);
  }, 4000);
}

   АВТОРИЗАЦИЯ
============================================================ */
function switchAuthTab(tab) {
  document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
  document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
  document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
  if (tab === 'register') genCaptcha();
}

function genCaptcha() {
  var a = Math.floor(Math.random() * 10) + 1;
  var b = Math.floor(Math.random() * 10) + 1;
  document.getElementById('captchaQ').textContent = a + ' + ' + b + ' = ?';
  document.getElementById('captchaQ').dataset.answer = a + b;
  document.getElementById('captchaA').value = '';
}

function handleRegister() {
  var nick = document.getElementById('regNick').value.trim();
  var pass = document.getElementById('regPass').value.trim();
  var pass2 = document.getElementById('regPass2').value.trim();
  var captcha = parseInt(document.getElementById('captchaA').value);
  var correct = parseInt(document.getElementById('captchaQ').dataset.answer);
  var err = document.getElementById('regError');

  if (!nick || !pass) { err.textContent = 'Заполни все поля!'; err.style.display = 'block'; return; }
  if (nick.length < 3) { err.textContent = 'Ник минимум 3 символа!'; err.style.display = 'block'; return; }
  if (!/^[a-zA-Zа-яА-Я0-9_]+$/.test(nick)) { err.textContent = 'Ник: буквы, цифры, _'; err.style.display = 'block'; return; }
  if (pass !== pass2) { err.textContent = 'Пароли не совпадают!'; err.style.display = 'block'; return; }
  if (pass.length < 4) { err.textContent = 'Пароль минимум 4!'; err.style.display = 'block'; return; }
  if (captcha !== correct) { err.textContent = 'Неверная капча!'; err.style.display = 'block'; genCaptcha(); return; }
  if (getUser(nick)) { err.textContent = 'Ник занят!'; err.style.display = 'block'; return; }

  DB.users.push({ nick: nick, pass: pass, bio: 'Привет! 👋', avatarImage: null });
  if (!DB.chats[nick]) DB.chats[nick] = [];
  saveDB();
  err.style.display = 'none';
  showToast('✅ Регистрация успешна!', '#4ade80');
  switchAuthTab('login');
  document.getElementById('loginNick').value = nick;
}

function handleLogin() {
  var nick = document.getElementById('loginNick').value.trim();
  var pass = document.getElementById('loginPass').value.trim();
  var err = document.getElementById('loginError');
  var user = getUser(nick);
  if (!user || user.pass !== pass) { err.textContent = 'Неверный ник или пароль!'; err.style.display = 'block'; return; }
  currentUser = user.nick;
  try { localStorage.setItem('messenger_v5_current', currentUser); } catch (e) {}
  err.style.display = 'none';
  startApp();
}

function goToPortal() {
  if (peer) peer.destroy();
  window.location.href = 'indext.html';
}

function switchSection(section, e) {
  currentSection = section;
  var tabs = document.querySelectorAll('.nav-tab');
  for (var i = 0; i < tabs.length; i++) tabs[i].classList.remove('active');
  if (e) e.target.classList.add('active');

  document.getElementById('sectionChannels').style.display = section === 'channels' ? 'block' : 'none';
  if (section === 'channels') renderChannels();
}

function searchPlayer() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(function() {
    var query = document.getElementById('searchInput').value.trim().toLowerCase();
    var box = document.getElementById('foundPlayers');
    box.innerHTML = '';
    if (!query || query.length < 2) return;
    var found = [];
    for (var i = 0; i < DB.users.length; i++) {
      var u = DB.users[i];
      if (u.nick.toLowerCase().indexOf(query) !== -1 && u.nick.toLowerCase() !== currentUser.toLowerCase()) {
        found.push(u);
      }
    }
    if (found.length === 0) { box.innerHTML = '<div style="color:#666; font-size:12px; padding:8px 12px;">Никого не найдено</div>'; return; }
    found.slice(0, 10).forEach(function(u) {
      var div = document.createElement('div');
      div.className = 'chat-item';
      div.innerHTML = '<div class="chat-avatar">' + avatarHTML(u) + '</div>' +
        '<div class="chat-info"><div class="chat-name">' + u.nick + '</div>' +
        '<div class="chat-last" style="color:#4ade80;">● Найден</div></div>' +
        '<div style="font-size:20px;">➕</div>';
      div.onclick = function() { addChat(u.nick); document.getElementById('searchInput').value = ''; box.innerHTML = ''; };
      box.appendChild(div);
    });
  }, 200);
}

function addChat(nick) {
  if (!DB.chats[currentUser]) DB.chats[currentUser] = [];
  var exists = false;
  for (var i = 0; i < DB.chats[currentUser].length; i++) {
    if (DB.chats[currentUser][i].nick === nick) { exists = true; break; }
  }
  if (!exists) { DB.chats[currentUser].push({ nick: nick, messages: [] }); saveDB(); }
  openChat(nick);
  renderChats();
}

/* ============================================================
   ЧАТЫ
============================================================ */
function renderChats() {
  var list = document.getElementById('chatsList');
  var chats = DB.chats[currentUser] || [];
  if (chats.length === 0) {
    list.innerHTML = '<p style="text-align:center; color:#666; padding:20px; font-size:13px;">Найди игрока по нику</p>';
    return;
  }
  list.innerHTML = chats.map(function(c) {
    var last = c.messages[c.messages.length - 1];
    var lastText = last ? (last.text || '📎 Файл') : 'Нет сообщений';
    var user = getUser(c.nick);
    return '<div class="chat-item ' + (currentChat === c.nick ? 'active' : '') + '" onclick="openChat(\'' + c.nick + '\')">' +
      '<div class="chat-avatar">' + avatarHTML(user) + '<span class="online-dot"></span></div>' +
      '<div class="chat-info"><div class="chat-name">' + c.nick + '</div>' +
      '<div class="chat-last">' + lastText + '</div></div></div>';
  }).join('');
}

function openChat(nick) {
  currentChat = nick;
  currentChannel = null;
  document.getElementById('mainHeaderName').textContent = nick;
  document.getElementById('mainHeaderSub').textContent = '● В сети';
  document.getElementById('mainHeaderActions').innerHTML = '<button class="icon-btn" onclick="openChatMenu()" title="Меню">⋮</button>';
  renderMessages();
  renderChats();
  if (window.innerWidth <= 800) document.getElementById('sidebar').classList.add('hidden');
}

function closeMainMobile() {
  document.getElementById('sidebar').classList.remove('hidden');
}

function renderMessages() {
  var box = document.getElementById('mainContent');
  var chat = null;
  var list = DB.chats[currentUser] || [];
  for (var i = 0; i < list.length; i++) if (list[i].nick === currentChat) { chat = list[i]; break; }
  if (!chat) return;

  var html = '';
  if (chat.messages.length === 0) {
    html = '<div style="text-align:center; color:#666; padding:40px;">Начни общение первым!</div>';
  } else {
    for (var idx = 0; idx < chat.messages.length; idx++) {
      var m = chat.messages[idx];
      if (m.deletedForMe) continue;
      var isMine = m.from === currentUser;
      var cls = isMine ? 'mine' : 'theirs';
      var content = m.text || '';
      if (m.deleted) content = '<i style="opacity:0.6;">Сообщение удалено</i>';
      if (m.file && !m.deleted) {
        if (m.file.type.indexOf('image/') === 0) content += '<img src="' + m.file.data + '">';
        else if (m.file.type.indexOf('video/') === 0) content += '<video src="' + m.file.data + '" controls></video>';
        else content += '<div style="padding:8px; background:rgba(0,0,0,0.3); border-radius:8px; margin-top:6px;">📎 ' + m.file.name + '</div>';
      }
      html += '<div class="msg-wrapper ' + cls + '">' +
        '<div class="msg">' + content + '<div class="msg-time">' + (m.time || '') + '</div></div>' +
        '</div>';
    }
  }
  html += '<div class="input-area" style="margin-top: 20px;">' +
    '<button class="icon-btn" onclick="document.getElementById(\'fileInput\').click()">📎</button>' +
    '<input type="file" id="fileInput" style="display: none;" onchange="sendFile(event)">' +
    '<textarea class="msg-input" id="msgInput" rows="1" placeholder="Сообщение..." onkeydown="if(event.key===\'Enter\'&&!event.shiftKey){event.preventDefault();sendMsg();}"></textarea>' +
    '<button class="send-btn" onclick="sendMsg()">➤</button>' +
    '</div>';
  box.innerHTML = html;
  box.scrollTop = box.scrollHeight;
}

function openChatMenu() {
  openModal('<h2>⚙️ Меню чата</h2>' +
    '<p style="color:#888; font-size:13px; text-align:center; margin-bottom:16px;">' + currentChat + '</p>' +
    '<button class="modal-btn danger" onclick="clearCurrentChat()">🧹 Очистить чат</button>' +
    '<button class="modal-btn danger" onclick="deleteCurrentChat()">🗑 Удалить чат</button>' +
    '<button class="modal-btn gray" onclick="closeModal()">Отмена</button>');
}

function clearCurrentChat() {
  if (!confirm('Очистить?')) return;
  var chat = null;
  for (var i = 0; i < DB.chats[currentUser].length; i++) if (DB.chats[currentUser][i].nick === currentChat) { chat = DB.chats[currentUser][i]; break; }
  if (chat) chat.messages = [];
  saveDB(); closeModal(); renderMessages(); renderChats();
  showToast('🧹 Очищено', '#4ade80');
}

function deleteCurrentChat() {
  if (!confirm('Удалить чат?')) return;
  DB.chats[currentUser] = DB.chats[currentUser].filter(function(c) { return c.nick !== currentChat; });
  saveDB(); closeModal();
  currentChat = null;
  document.getElementById('mainContent').innerHTML = '<div style="text-align:center; color:#666; padding:60px;"><div style="font-size:60px;">💬</div><h3>Чат удалён</h3></div>';
  renderChats();
}

function sendMsg() {
  var input = document.getElementById('msgInput');
  var text = input.value.trim();
  if (!text || !currentChat) return;
  var msg = { text: text, from: currentUser, time: new Date().toLocaleTimeString().slice(0, 5) };
  var chat = null;
  for (var i = 0; i < DB.chats[currentUser].length; i++) if (DB.chats[currentUser][i].nick === currentChat) { chat = DB.chats[currentUser][i]; break; }
  chat.messages.push(msg);
  if (!DB.chats[currentChat]) DB.chats[currentChat] = [];
  var recvChat = null;
  for (var j = 0; j < DB.chats[currentChat].length; j++) if (DB.chats[currentChat][j].nick === currentUser) { recvChat = DB.chats[currentChat][j]; break; }
  if (!recvChat) { DB.chats[currentChat].push({ nick: currentUser, messages: [] }); recvChat = DB.chats[currentChat][DB.chats[currentChat].length - 1]; }
  recvChat.messages.push(msg);
  saveDB();
  input.value = '';
  renderMessages();
  renderChats();
}

function sendFile(event) {
  var file = event.target.files[0];
  if (!file || !currentChat) return;
  if (file.size > 5 * 1024 * 1024) { showToast('⚠ Максимум 5 МБ', '#f87171'); return; }
  var reader = new FileReader();
  reader.onload = function(e) {
    var fileData = { name: file.name, type: file.type, data: e.target.result };
    var msg = { text: '', from: currentUser, time: new Date().toLocaleTimeString().slice(0,5), file: fileData };
    var chat = null;
    for (var i = 0; i < DB.chats[currentUser].length; i++) if (DB.chats[currentUser][i].nick === currentChat) { chat = DB.chats[currentUser][i]; break; }
    chat.messages.push(msg);
    saveDB();
    renderMessages();
  };
  reader.readAsDataURL(file);
  event.target.value = '';
}

function renderChannels() {

function createChannel() {
  var name = document.getElementById('channelName').value.trim();
  var desc = document.getElementById('channelDesc').value.trim();
  if (!name) { showToast('⚠ Введи название', '#f87171'); return; }
  DB.channels.push({
    id: uid(), name: name, description: desc, avatar: null,
    owner: currentUser, admins: [], subscribers: [currentUser], posts: [],
    allowPostByAll: false, allowComments: true, allowReactions: true
  });
  saveDB(); closeModal(); renderChannels();
  showToast('📺 Канал создан!', '#4ade80');
}

function openChannel(id) {
  var channel = null;
  for (var i = 0; i < DB.channels.length; i++) if (DB.channels[i].id === id) { channel = DB.channels[i]; break; }
  if (!channel) return;
  currentChannel = channel;
  currentChat = null;

  var isSub = channel.subscribers.indexOf(currentUser) !== -1;
  var isOwner = channel.owner === currentUser;
  var isAdmin = channel.admins.indexOf(currentUser) !== -1;
  var canPost = isOwner || isAdmin || (channel.allowPostByAll && isSub);

  document.getElementById('mainHeaderName').textContent = '📺 ' + channel.name;
  document.getElementById('mainHeaderSub').textContent = channel.subscribers.length + ' подписчиков';
  document.getElementById('mainHeaderActions').innerHTML = '';

  var html = '<div class="post" style="background:linear-gradient(135deg, #3b82f6, #ec4899); border:none;">' +
    '<div style="display:flex; align-items:center; gap:16px;">' +
      '<div class="channel-card-avatar" style="width:80px; height:80px; font-size:32px;">' + (channel.avatar ? '<img src="' + channel.avatar + '">' : channel.name[0].toUpperCase()) + '</div>' +
      '<div style="flex:1;">' +
        '<div style="font-size:20px; font-weight:900;">' + channel.name + '</div>' +
        '<div style="font-size:13px; opacity:0.9;">👑 ' + channel.owner + ' · 👥 ' + channel.subscribers.length + '</div>' +
        '<div style="font-size:13px; opacity:0.9; margin-top:4px;">' + (channel.description || '') + '</div>' +
      '</div>' +
    '</div></div>';

  html += '<div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;">';
  html += '<button class="reaction-btn ' + (isSub ? 'active' : '') + '" onclick="toggleSubscribe(\'' + channel.id + '\')">' + (isSub ? '✅ Вы подписаны' : '➕ Подписаться') + '</button>';
  if (canPost) html += '<button class="reaction-btn" onclick="openCreatePost(\'' + channel.id + '\')">📝 Новый пост</button>';
  if (isOwner) html += '<button class="reaction-btn" onclick="channelSettings(\'' + channel.id + '\')">⚙️ Настройки</button>';
  html += '</div>';

  if (channel.posts.length === 0) {
    html += '<div style="text-align:center; color:#666; padding:40px;">Пока нет постов</div>';
  } else {
    channel.posts.slice().reverse().forEach(function(post) {
      var user = getUser(post.author);
      html += '<div class="post">' +
        '<div class="post-header">' +
          '<div class="channel-card-avatar" style="width:42px; height:42px; font-size:16px;">' + avatarHTML(user) + '</div>' +
          '<div style="flex:1;"><div class="post-author">' + post.author + '</div>' +
          '<div class="post-time">' + post.time + '</div></div>' +
        '</div>';
      if (post.text) html += '<div class="post-text">' + post.text + '</div>';
      if (post.image) html += '<img src="' + post.image + '" class="post-image">';
      if (post.video) html += '<video src="' + post.video + '" controls class="post-video"></video>';
      html += '</div>';
    });
  }
  document.getElementById('mainContent').innerHTML = html;
  renderChannels();
  if (window.innerWidth <= 800) document.getElementById('sidebar').classList.add('hidden');
}

function toggleSubscribe(id) {
  var channel = null;
  for (var i = 0; i < DB.channels.length; i++) if (DB.channels[i].id === id) { channel = DB.channels[i]; break; }
  if (!channel) return;
  var idx = channel.subscribers.indexOf(currentUser);
  if (idx === -1) { channel.subscribers.push(currentUser); showToast('✅ Подписан!', '#4ade80'); }
  else { channel.subscribers.splice(idx, 1); showToast('Отписка', '#888'); }
  saveDB();
  openChannel(id);
}

function openCreatePost(id) {
  openModal('<h2>📝 Новый пост</h2>' +
    '<label>Текст</label><textarea id="postText" placeholder="О чём пост?"></textarea>' +
    '<button class="modal-btn green" onclick="publishPost(\'' + id + '\')">📤 Опубликовать</button>' +
    '<button class="modal-btn gray" onclick="closeModal()">Отмена</button>');
}

function publishPost(channelId) {
  var channel = null;
  for (var i = 0; i < DB.channels.length; i++) if (DB.channels[i].id === channelId) { channel = DB.channels[i]; break; }
  if (!channel) return;
  var text = document.getElementById('postText').value.trim();
  if (!text) { showToast('⚠ Пусто', '#f87171'); return; }
  channel.posts.push({
    id: uid(), author: currentUser, text: text,
    time: new Date().toLocaleString(),
    reactions: { like: 0, love: 0, fire: 0, laugh: 0 }, myReactions: {}, comments: []
  });
  saveDB(); closeModal(); openChannel(channelId);
  showToast('📝 Опубликовано!', '#4ade80');
}

function channelSettings(id) {
  var channel = null;
  for (var i = 0; i < DB.channels.length; i++) if (DB.channels[i].id === id) { channel = DB.channels[i]; break; }
  if (!channel || channel.owner !== currentUser) { showToast('⚠ Только владелец', '#f87171'); return; }
  openModal('<h2>⚙️ Настройки</h2>' +
    '<label>Название</label><input type="text" id="settingsName" value="' + channel.name + '" maxlength="30">' +
    '<label>Описание</label><textarea id="settingsDesc">' + (channel.description || '') + '</textarea>' +
    '<button class="modal-btn green" onclick="saveChannelSettings(\'' + id + '\')">💾 Сохранить</button>' +
    '<button class="modal-btn danger" onclick="deleteChannel(\'' + id + '\')">🗑 Удалить канал</button>' +
    '<button class="modal-btn gray" onclick="closeModal()">Закрыть</button>');
}

function saveChannelSettings(id) {
  var channel = null;
  for (var i = 0; i < DB.channels.length; i++) if (DB.channels[i].id === id) { channel = DB.channels[i]; break; }
  if (!channel) return;
  var name = document.getElementById('settingsName').value.trim();
  var desc = document.getElementById('settingsDesc').value.trim();
  if (name) channel.name = name;
  channel.description = desc;
  saveDB(); closeModal(); openChannel(id); renderChannels();
  showToast('✅ Сохранено!', '#4ade80');
}

function deleteChannel(id) {
  if (!confirm('Удалить канал?')) return;
  DB.channels = DB.channels.filter(function(c) { return c.id !== id; });
  saveDB(); closeModal(); renderChannels();
  document.getElementById('mainContent').innerHTML = '<div style="text-align:center; color:#666; padding:60px;"><div style="font-size:60px;">📺</div><h3>Канал удалён</h3></div>';
}

/* ============================================================
   НАСТРОЙКИ
============================================================ */
function updateProfileUI() {
  var user = getUser(currentUser);
  if (!user) return;
  document.getElementById('myName').textContent = currentUser;
  document.getElementById('myAvatar').innerHTML = avatarHTML(user);
}

function openSettings() {
  var user = getUser(currentUser);
  document.getElementById('mainHeaderName').textContent = '⚙️ Настройки';
  document.getElementById('mainHeaderSub').textContent = 'Управление';
  document.getElementById('mainHeaderActions').innerHTML = '';
  document.getElementById('mainContent').innerHTML =
    '<div style="text-align:center; padding:30px 20px; background:linear-gradient(135deg, #3b82f6, #ec4899); border-radius:20px; margin-bottom:20px;">' +
      '<div style="width:110px; height:110px; border-radius:50%; background:#fff; color:#ec4899; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:42px; margin:0 auto 12px; overflow:hidden;">' + avatarHTML(user) + '</div>' +
      '<div style="font-size:22px; font-weight:800;">' + currentUser + '</div>' +
      '<div style="font-size:13px; opacity:0.9;">' + (user.bio || 'Привет!') + '</div>' +
    '</div>' +
    '<div style="display:flex; flex-direction:column; gap:8px;">' +
      '<button class="modal-btn" onclick="changeBio()">📝 Сменить описание</button>' +
      '<button class="modal-btn" onclick="openServerMenu()">🌐 Сервер</button>' +
      '<button class="modal-btn gray" onclick="goToPortal()">🏠 В портал</button>' +
      '<button class="modal-btn danger" onclick="logout()">🚪 Выйти</button>' +
    '</div>';
  if (window.innerWidth <= 800) document.getElementById('sidebar').classList.add('hidden');
}

function changeBio() {
  var user = getUser(currentUser);
  openModal('<h2>📝 Описание</h2>' +
    '<textarea id="newBio">' + (user.bio || '') + '</textarea>' +
    '<button class="modal-btn green" onclick="saveBio()">💾 Сохранить</button>' +
    '<button class="modal-btn gray" onclick="closeModal()">Отмена</button>');
}

function saveBio() {
  var user = getUser(currentUser);
  user.bio = document.getElementById('newBio').value.trim();
  saveDB(); closeModal(); openSettings();
  showToast('✅ Сохранено', '#4ade80');
}

function logout() {
  if (!confirm('Выйти?')) return;
  try { localStorage.removeItem('messenger_v5_current'); } catch (e) {}
  if (peer) peer.destroy();
  location.reload();
}

/* ============================================================
   МОДАЛКИ
============================================================ */
function openModal(html) {
  document.getElementById('modalCard').innerHTML = html;
  document.getElementById('modal').classList.add('active');
}
function closeModal() {
  document.getElementById('modal').classList.remove('active');
}

/* ============================================================
   СТАРТ
============================================================ */
window.addEventListener('load', function() {
  loadDB();
  var saved = null;
  try { saved = localStorage.getItem('messenger_v5_current'); } catch (e) {}
  if (saved && getUser(saved)) { currentUser = saved; startApp(); }
  else genCaptcha();
});

window.addEventListener('resize', function() {
  if (window.innerWidth > 800) document.getElementById('sidebar').classList.remove('hidden');
});
</script>
</body>
</html>
