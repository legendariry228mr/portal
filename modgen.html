<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⛏ Генератор Модов</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%2300d4ff'/%3E%3Cstop offset='100%25' stop-color='%237b2ff7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='512' height='512' rx='120' fill='url(%23g)'/%3E%3Ctext x='50%25' y='60%25' font-family='Arial,sans-serif' font-size='260' font-weight='900' fill='%23ffffff' text-anchor='middle' dominant-baseline='middle'%3E⛏%3C/text%3E%3C/svg%3E">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    color: #fff; padding: 20px;
    display: flex; justify-content: center;
  }
  .app { width: 100%; max-width: 1000px; display: flex; flex-direction: column; gap: 16px; }
  .header {
    display: flex; align-items: center; gap: 14px;
    padding: 20px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
  }
  .logo {
    width: 52px; height: 52px; border-radius: 14px;
    background: linear-gradient(135deg, #00d4ff, #7b2ff7);
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; box-shadow: 0 0 25px rgba(0,212,255,0.6);
  }
  .header h1 {
    font-size: 22px;
    background: linear-gradient(135deg, #00d4ff, #7b2ff7);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .header p { font-size: 12px; color: #888; }
  .back-btn {
    margin-left: auto;
    padding: 10px 18px; border-radius: 12px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    color: #fff; text-decoration: none;
    font-size: 13px; font-weight: 700;
    transition: all 0.2s;
  }
  .back-btn:hover { background: rgba(123,47,247,0.4); }

  .card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px; padding: 24px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .field { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 200px; }
  .field label { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 1.5px; }
  .field select, .field textarea {
    padding: 12px 16px; border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.05);
    color: #fff; font-size: 14px;
    outline: none; font-family: inherit;
  }
  .field select:focus, .field textarea:focus {
    border-color: #7b2ff7;
    box-shadow: 0 0 0 3px rgba(123,47,247,0.2);
  }
  .field option { background: #1a1a2e; }
  textarea { resize: vertical; min-height: 100px; }

  button {
    padding: 16px 40px; border: none; border-radius: 14px;
    background: linear-gradient(135deg, #7b2ff7, #00d4ff);
    color: #fff; font-size: 16px; font-weight: 800;
    cursor: pointer; transition: all 0.2s;
    box-shadow: 0 10px 40px rgba(123,47,247,0.5);
    align-self: flex-start;
  }
  button:hover { transform: scale(1.03); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .output {
    background: #0d0d1a;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px; padding: 20px;
    min-height: 200px; max-height: 500px;
    font-family: 'Consolas', monospace;
    font-size: 13px; line-height: 1.6;
    white-space: pre-wrap; word-wrap: break-word;
    overflow-y: auto;
  }
  .output::-webkit-scrollbar { width: 8px; }
  .output::-webkit-scrollbar-thumb { background: rgba(123,47,247,0.5); border-radius: 4px; }
  .output:empty::before {
    content: 'Здесь появится код мода от Qwen...';
    color: #555;
  }
  .hint { font-size: 11px; color: #666; text-align: center; }
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="logo">⛏</div>
    <div>
      <h1>Генератор Модов</h1>
      <p>Minecraft · Forge / Fabric · через Qwen</p>
    </div>
    <a class="back-btn" href="indext.html">← В портал</a>
  </div>

  <div class="card">
    <div class="row">
      <div class="field">
        <label>Версия Minecraft</label>
        <select id="mcVersion">
          <option>1.16.5</option>
          <option>1.17.1</option>
          <option>1.18.2</option>
          <option>1.19.4</option>
          <option>1.20.1</option>
          <option>1.20.4</option>
          <option selected>1.21.1</option>
          <option>1.21.4</option>
          <option>1.21.11</option>
        </select>
      </div>
      <div class="field">
        <label>Загрузчик</label>
        <select id="loader">
          <option>Forge</option>
          <option>Fabric</option>
          <option>NeoForge</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label>Опиши мод</label>
      <textarea id="prompt">Меч, который поджигает врагов</textarea>
    </div>

    <button id="genBtn" onclick="generate()">🚀 Сгенерировать мод</button>

    <div class="output" id="output"></div>

    <div class="hint">⚠ Убедись, что LM Studio запущен и Qwen загружена.</div>
  </div>

</div>

<script>
  const API_URL = 'http://localhost:1234/v1/chat/completions';
  const output = document.getElementById('output');
  const genBtn = document.getElementById('genBtn');

  async function generate() {
    const mc = document.getElementById('mcVersion').value;
    const loader = document.getElementById('loader').value;
    const prompt = document.getElementById('prompt').value.trim();

    if (!prompt) {
      output.textContent = '⚠ Напиши описание мода.';
      return;
    }

    genBtn.disabled = true;
    genBtn.textContent = '⏳ Qwen думает...';
    output.textContent = 'Запрос отправлен. Ждём ответ...';

    const system = `Ты разработчик модов Minecraft. Пользователь хочет мод для версии ${mc} на ${loader}. Отвечай на русском. Дай:
1) Описание мода.
2) Структуру файлов.
3) Java-код главного класса.
4) Инструкцию по сборке через Gradle.`;

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'qwen',
          messages: [
            { role: 'system', content: system },
            { role: 'user', content: prompt }
          ],
          temperature: 0.7,
          max_tokens: 2048,
          stream: false
        })
      });

      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      output.textContent = data.choices?.[0]?.message?.content || 'Пустой ответ.';
    } catch (e) {
      output.textContent = '⚠ Ошибка: ' + e.message + '\n\nПроверь LM Studio, модель, CORS.';
    } finally {
      genBtn.disabled = false;
      genBtn.textContent = '🚀 Сгенерировать мод';
    }
  }
</script>
</body>
</html>
